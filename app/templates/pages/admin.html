{% extends "base.html" %}

{% block content %}
<main class="container py-5">
    <!-- Login Form -->
    <div id="login-form" class="card shadow-sm mx-auto" style="max-width: 400px; {% if is_admin %}display: none;{% endif %}">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 rounded-circle p-3 d-inline-flex mb-3">
                    <i class="bi bi-shield-lock fs-3 text-primary"></i>
                </div>
                <h1 class="h3 mb-2">Admin Login</h1>
                <p class="text-muted">Enter your credentials to access the admin dashboard</p>
            </div>
            
            <form method="POST" action="{% url 'admin_login' %}" class="needs-validation">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter admin username" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggle-admin-password">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </form>
        </div>
    </div>
    
    <!-- Dashboard -->
    <div id="dashboard" class="{% if not is_admin %}d-none{% endif %}">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="bi bi-shield me-2"></i>Admin Dashboard
            </h1>
            <div>
                <a href="{% url 'admin_listings' %}" class="btn btn-outline-primary me-2">
                    <i class="bi bi-grid me-2"></i>View All Records
                </a>
                <form method="POST" action="{% url 'admin_logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <p class="text-muted mb-1">Total Encodes</p>
                                <h3 class="mb-0">{{ total_records|default:"0" }}</h3>
                            </div>
                            <div class="bg-primary bg-opacity-10 p-3 rounded">
                                <i class="bi bi-lock fs-4 text-primary"></i>
                            </div>
                        </div>
                        <p class="text-success mt-2 mb-0">
                            <i class="bi bi-arrow-up"></i> System records
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</main>
{% endblock %}
